<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="inh-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inh-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="canister-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="inh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0891B2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#inh-bg-glow)" />

  <g filter="url(#inh-shadow)" transform="translate(10, 0)">
    <!-- Canister Top -->
    <rect x="52" y="24" width="32" height="28" rx="6" fill="url(#canister-grad)" stroke="#64748B" stroke-width="1"/>
    <ellipse cx="68" cy="24" rx="16" ry="3" fill="#E2E8F0"/>

    <!-- L-Shaped Inhaler Plastic Body -->
    <path d="M48 42 L88 42 C92 42, 94 45, 94 50 L94 92 C94 98, 98 102, 106 102 L112 102 C116 102, 118 105, 118 108 L118 124 C118 128, 114 130, 110 130 L64 130 C54 130, 48 122, 48 112 L48 50 C48 45, 46 42, 48 42 Z" 
          fill="url(#inh-body)" stroke="#0E7490" stroke-width="1.2"/>

    <!-- Mouthpiece Oval Opening -->
    <ellipse cx="118" cy="116" rx="4" ry="10" fill="#083344" stroke="#06B6D4" stroke-width="1"/>

    <!-- Air Aerosol Cloud Illustration -->
    <g opacity="0.65" transform="translate(122, 108)">
      <circle cx="6" cy="4" r="2.5" fill="#E0F2FE"/>
      <circle cx="12" cy="2" r="3.5" fill="#BAE6FD"/>
      <circle cx="14" cy="12" r="2" fill="#E0F2FE"/>
      <circle cx="20" cy="7" r="4" fill="#67E8F9"/>
    </g>

    <!-- Medical Rx White Badge -->
    <rect x="56" y="66" width="24" height="26" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <rect x="60" y="70" width="16" height="3" rx="1" fill="#0891B2"/>
    <text x="68" y="85" fill="#0E7490" font-family="monospace" font-weight="900" font-size="7" text-anchor="middle">200 PUFF</text>

    <!-- Highlights -->
    <path d="M52 50 L52 110" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
