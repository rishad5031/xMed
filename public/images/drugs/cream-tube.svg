<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="crm-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tube-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="tube-stripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="crm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#crm-bg-glow)" />

  <g filter="url(#crm-shadow)" transform="rotate(-30 80 80)">
    <!-- Tube Cap -->
    <rect x="71" y="24" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <line x1="74" y1="24" x2="74" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="77" y1="24" x2="77" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="80" y1="24" x2="80" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="83" y1="24" x2="83" y2="38" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="86" y1="24" x2="86" y2="38" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Tube Shoulder & Body -->
    <path d="M72 38 L88 38 L100 60 L100 126 C100 130, 95 132, 90 132 L70 132 C65 132, 60 130, 60 126 L60 60 Z" 
          fill="url(#tube-body)" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Crimped End (Tail) -->
    <rect x="58" y="126" width="44" height="8" rx="1" fill="#94A3B8" stroke="#64748B" stroke-width="0.8"/>
    <line x1="62" y1="126" x2="62" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="66" y1="126" x2="66" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="70" y1="126" x2="70" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="74" y1="126" x2="74" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="78" y1="126" x2="78" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="82" y1="126" x2="82" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="86" y1="126" x2="86" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="90" y1="126" x2="90" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="94" y1="126" x2="94" y2="134" stroke="#475569" stroke-width="0.8"/>
    <line x1="98" y1="126" x2="98" y2="134" stroke="#475569" stroke-width="0.8"/>

    <!-- Brand Green Stripe -->
    <path d="M60 70 L100 70 L100 92 L60 92 Z" fill="url(#tube-stripe)"/>
    <text x="80" y="84" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="0.5">EDCL CREAM</text>

    <text x="80" y="106" fill="#059669" font-family="monospace" font-weight="800" font-size="7" text-anchor="middle">1% &bull; 25g</text>

    <!-- Highlights -->
    <path d="M63 42 L63 124" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
