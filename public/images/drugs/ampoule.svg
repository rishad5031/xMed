<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="amp-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amp-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="amp-liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="amp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#amp-bg-glow)" />

  <g filter="url(#amp-shadow)">
    <!-- Ampoule Tip Top -->
    <path d="M77 24 C77 22, 83 22, 83 24 L85 40 C85 44, 82 46, 82 48 C82 50, 86 54, 87 60 L87 122 C87 130, 83 134, 80 134 C77 134, 73 130, 73 122 L73 60 C74 54, 78 50, 78 48 C78 46, 75 44, 75 40 Z" 
          fill="url(#amp-glass)" stroke="#64748B" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Break Ring (Red / Amber Band) -->
    <rect x="76.5" y="47" width="7" height="2.5" rx="1" fill="#F43F5E" />
    <circle cx="80" cy="48.2" r="0.8" fill="#FFE4E6" />

    <!-- Liquid inside body -->
    <path d="M74.5 82 L85.5 82 L85.5 121 C85.5 127.5, 82.5 132, 80 132 C77.5 132, 74.5 127.5, 74.5 121 Z" 
          fill="url(#amp-liquid)"/>

    <!-- Liquid Meniscus / Highlight -->
    <ellipse cx="80" cy="82" rx="5.5" ry="1.2" fill="#6EE7B7" opacity="0.8"/>

    <!-- Glass Reflection Highlight -->
    <path d="M76 62 L76 120" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M78 28 L78 38" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Medical Rx Icon Badge -->
    <rect x="76" y="94" width="8" height="12" rx="1.5" fill="#064E3B" opacity="0.85"/>
    <path d="M78 98 L82 98 M80 96 L80 102" stroke="#34D399" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
