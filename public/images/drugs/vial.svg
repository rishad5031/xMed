<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="vial-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vial-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="vial-crim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="vial-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#94A3B8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="vial-powder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="vial-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#vial-bg-glow)" />

  <g filter="url(#vial-shadow)">
    <!-- Flip-off cap -->
    <rect x="67" y="30" width="26" height="7" rx="3" fill="url(#vial-cap)" />
    <!-- Crimp Neck -->
    <rect x="71" y="37" width="18" height="6" rx="1" fill="url(#vial-crim)" />
    <!-- Glass Bottle Body -->
    <path d="M60 48 C60 44, 70 43, 72 43 L88 43 C90 43, 100 44, 100 48 L100 118 C100 126, 95 130, 80 130 C65 130, 60 126, 60 118 Z" 
          fill="url(#vial-glass)" stroke="#64748B" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Powder Cake / Solution Base -->
    <path d="M62 92 L98 92 L98 118 C98 124, 93 128, 80 128 C67 128, 62 124, 62 118 Z" 
          fill="url(#vial-powder)"/>
    <ellipse cx="80" cy="92" rx="18" ry="3" fill="#E2E8F0"/>

    <!-- Pharmaceutical Label -->
    <rect x="63" y="55" width="34" height="30" rx="3" fill="#FFFFFF" opacity="0.95" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="66" y="59" width="16" height="3" rx="1" fill="#0284C7"/>
    <rect x="66" y="65" width="28" height="1.5" rx="0.7" fill="#64748B"/>
    <rect x="66" y="69" width="22" height="1.5" rx="0.7" fill="#94A3B8"/>
    <path d="M85 75 L91 75 M88 72 L88 78" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Reflection Highlights -->
    <path d="M64 50 L64 120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
