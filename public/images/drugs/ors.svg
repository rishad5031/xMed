<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="ors-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ors-sachet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="ors-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="ors-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#ors-bg-glow)" />

  <g filter="url(#ors-shadow)" transform="rotate(-4 80 80)">
    <!-- Sachet Foil Pouch -->
    <rect x="38" y="28" width="84" height="104" rx="6" fill="url(#ors-sachet)" stroke="#94A3B8" stroke-width="1.2"/>
    
    <!-- Top & Bottom Heat Seals (Crimped Edges) -->
    <rect x="38" y="28" width="84" height="8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.6"/>
    <rect x="38" y="124" width="84" height="8" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.6"/>
    
    <!-- Tear Notch -->
    <polygon points="38,40 43,43 38,46" fill="#94A3B8"/>

    <!-- Green Brand Banner -->
    <rect x="38" y="38" width="84" height="28" fill="url(#ors-header)"/>
    <text x="80" y="52" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1">EDCL &bull; ORS</text>
    <text x="80" y="61" fill="#D1FAE5" font-family="sans-serif" font-weight="600" font-size="6.5" text-anchor="middle">Oral Rehydration Salts</text>

    <!-- Water Drop & Electrolyte Graphic -->
    <g transform="translate(68, 70)">
      <path d="M12 0 C12 0, 2 12, 2 18 C2 23.5, 6.5 28, 12 28 C17.5 28, 22 23.5, 22 18 C22 12, 12 0, 12 0 Z" fill="#0EA5E9" opacity="0.85"/>
      <path d="M8 17 C8 15, 10 13, 12 12" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Salt / Hydration Plus Marks -->
      <path d="M22 6 L26 6 M24 4 L24 8" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-2 18 L2 18 M0 16 L0 20" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Text Formula lines -->
    <rect x="46" y="104" width="68" height="2" rx="1" fill="#64748B"/>
    <rect x="46" y="109" width="48" height="2" rx="1" fill="#94A3B8"/>
    <text x="80" y="119" fill="#059669" font-family="monospace" font-weight="700" font-size="7" text-anchor="middle">WHO FORMULA &bull; 500ml</text>
  </g>
</svg>
