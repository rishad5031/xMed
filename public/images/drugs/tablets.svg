<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="tab-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blister-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="tab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.4"/>
    </filter>
    <filter id="pill-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#tab-bg-glow)" />

  <g filter="url(#tab-shadow)" transform="rotate(-6 80 80)">
    <!-- Blister Pack Base -->
    <rect x="36" y="32" width="88" height="96" rx="12" fill="url(#blister-foil)" stroke="#94A3B8" stroke-width="1.2"/>
    <!-- Foil Texture Grid Lines -->
    <line x1="36" y1="80" x2="124" y2="80" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="80" y1="32" x2="80" y2="128" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

    <!-- Pill 1 (Top Left) -->
    <g filter="url(#pill-shadow)">
      <circle cx="58" cy="56" r="14" fill="url(#pill-grad)" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="47" y1="56" x2="69" y2="56" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Pill 2 (Top Right) -->
    <g filter="url(#pill-shadow)">
      <circle cx="102" cy="56" r="14" fill="url(#pill-grad)" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="91" y1="56" x2="113" y2="56" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Pill 3 (Bottom Left) -->
    <g filter="url(#pill-shadow)">
      <circle cx="58" cy="104" r="14" fill="url(#pill-grad)" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="47" y1="104" x2="69" y2="104" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Pill 4 (Bottom Right - Mint Colored Pill) -->
    <g filter="url(#pill-shadow)">
      <circle cx="102" cy="104" r="14" fill="#A7F3D0" stroke="#6EE7B7" stroke-width="1"/>
      <line x1="91" y1="104" x2="113" y2="104" stroke="#059669" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Blister Pack Edge Chamfers -->
    <circle cx="42" cy="38" r="2" fill="#64748B" opacity="0.4"/>
    <circle cx="118" cy="38" r="2" fill="#64748B" opacity="0.4"/>
    <circle cx="42" cy="122" r="2" fill="#64748B" opacity="0.4"/>
    <circle cx="118" cy="122" r="2" fill="#64748B" opacity="0.4"/>
  </g>
</svg>
