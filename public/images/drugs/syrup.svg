<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="syr-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#D97706" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="syr-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="syr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#syr-bg-glow)" />

  <g filter="url(#syr-shadow)">
    <!-- Measuring Cup on top of Cap -->
    <path d="M68 20 L92 20 L89 32 L71 32 Z" fill="#FFFFFF" opacity="0.4" stroke="#CBD5E1" stroke-width="0.8"/>
    <line x1="73" y1="24" x2="78" y2="24" stroke="#64748B" stroke-width="0.7"/>
    <line x1="72" y1="28" x2="80" y2="28" stroke="#64748B" stroke-width="0.7"/>

    <!-- Bottle White Cap -->
    <rect x="68" y="32" width="24" height="12" rx="2" fill="url(#syr-cap)" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="72" y1="34" x2="72" y2="42" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="76" y1="34" x2="76" y2="42" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="80" y1="34" x2="80" y2="42" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="84" y1="34" x2="84" y2="42" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="88" y1="34" x2="88" y2="42" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Bottle Body (Amber Glass) -->
    <path d="M54 52 C54 46, 64 44, 70 44 L90 44 C96 44, 106 46, 106 52 L106 128 C106 134, 100 138, 92 138 L68 138 C60 138, 54 134, 54 128 Z" 
          fill="url(#amber-glass)" stroke="#78350F" stroke-width="1.2"/>

    <!-- Liquid Line -->
    <ellipse cx="80" cy="56" rx="24" ry="4" fill="#F59E0B" opacity="0.7"/>

    <!-- Label -->
    <rect x="58" y="65" width="44" height="48" rx="4" fill="#FFFFFF" opacity="0.95" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="62" y="70" width="24" height="4" rx="1" fill="#D97706"/>
    <rect x="62" y="78" width="36" height="2" rx="1" fill="#64748B"/>
    <rect x="62" y="83" width="28" height="2" rx="1" fill="#94A3B8"/>
    <rect x="62" y="88" width="32" height="2" rx="1" fill="#CBD5E1"/>

    <!-- Spoon / Dose icon on label -->
    <path d="M86 98 C86 95, 94 95, 94 98 C94 101, 88 102, 88 106 L86 106 Z" fill="#D97706" opacity="0.7"/>

    <!-- Glass Highlights -->
    <path d="M58 52 L58 130" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
