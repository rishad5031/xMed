<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="cap-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cap-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cap-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="cap-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#cap-bg-glow)" />

  <!-- Capsule 1 (Diagonal Left) -->
  <g filter="url(#cap-shadow)" transform="rotate(-35 70 70)">
    <!-- Back / Left Half (Teal) -->
    <path d="M45 60 C45 49, 54 40, 65 40 L70 40 L70 80 L65 80 C54 80, 45 71, 45 60 Z" 
          fill="url(#cap-teal)"/>
    <!-- Front / Right Half (White) -->
    <path d="M70 40 L75 40 C86 40, 95 49, 95 60 C95 71, 86 80, 75 80 L70 80 Z" 
          fill="url(#cap-white)"/>
    <!-- Seam Ring -->
    <line x1="70" y1="40" x2="70" y2="80" stroke="#047857" stroke-width="1.5"/>
    <!-- Specular Highlight -->
    <path d="M52 48 Q70 45 88 48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Capsule 2 (Diagonal Right - Cyan/Amber/White) -->
  <g filter="url(#cap-shadow)" transform="rotate(40 95 95)">
    <!-- Back Half (Cyan) -->
    <path d="M75 85 C75 74, 84 65, 95 65 L100 65 L100 105 L95 105 C84 105, 75 96, 75 85 Z" 
          fill="url(#cap-cyan)"/>
    <!-- Front Half (White) -->
    <path d="M100 65 L105 65 C116 65, 125 74, 125 85 C125 96, 116 105, 105 105 L100 105 Z" 
          fill="url(#cap-white)"/>
    <!-- Seam -->
    <line x1="100" y1="65" x2="100" y2="105" stroke="#0369A1" stroke-width="1.5"/>
    <!-- Highlight -->
    <path d="M82 73 Q100 70 118 73" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
